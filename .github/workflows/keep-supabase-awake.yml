name: Keep Supabase Awake

on:
  schedule:
    # Runs every Monday and Thursday at 12:00 PM UTC
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase API
        run: |
          echo "Pinging Supabase to keep project active..."
          # We remove --fail and add || true so the workflow doesn't fail 
          # even if Supabase returns an error (like 503 if already paused)
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" || true
